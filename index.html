<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ABSEN IBNU KATSIR PEDULI</title>
<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="supabase.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
   <link rel="manifest" href="manifest.json">

        <meta name="theme-color" content="#ea580c">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-status-bar-style" content="default">
        <meta name="apple-mobile-web-app-title" content="OWOJ">

        <link rel="apple-touch-icon" href="180.png">
</head>
<body>
<div id="app">
<link rel="stylesheet" href="style.css">
<template v-if="!currentUser">
  <!-- LOGIN PAGE -->
  <div style="min-height:100vh;display:flex;flex-direction:column;background:linear-gradient(160deg,#bb9707 0%,#644404 100%);padding:0;">
    <!-- Header art -->
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px 24px;">
      <div style="width:72px;height:72px;background:rgba(255,255,255,0.2);border-radius:20px;display:flex;align-items:center;justify-content:center;margin-bottom:16px;">
        <svg width="36" height="36" fill="none" viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z" fill="white"/></svg>
      </div>
      <h1 style="color:white;font-size:28px;font-weight:700;letter-spacing:-0.5px;">Absen Ibnu Katsir Peduli</h1>
      <p style="color:rgba(255,255,255,0.8);font-size:14px;margin-top:6px;">Bismillah, BISA!</p>
    </div>

    <!-- Login Card -->
    <div style="background:white;border-radius:28px 28px 0 0;padding:32px 24px 40px;">
      <h2 style="font-size:20px;font-weight:700;color:#111827;margin-bottom:6px;">Assalamualaikum</h2>
  <!--    <p style="font-size:14px;color:#6B7280;margin-bottom:28px;">Masuk untuk mencatat kehadiran Anda</p> -->

<div style="margin-bottom:16px;">
  <label style="display:block;font-size:13px;font-weight:600;color:#374151;margin-bottom:8px;">Nama</label>
  <select v-model="loginForm.userId"
    style="width:100%;padding:14px 16px;border:1.5px solid #E5E7EB;border-radius:12px;font-size:15px;color:#111827;outline:none;background:white;transition:border 0.2s;"
    @focus="e=>e.target.style.borderColor='#bb9707'" @blur="e=>e.target.style.borderColor='#E5E7EB'">
    <option value="" disabled>{{employeeUsers.length}} Mujahid</option>
    <option v-for="u in db.users" :key="u.id" :value="u.id">{{ u.name }}</option>
  </select>
</div>
      <div style="margin-bottom:24px;">
        <label style="display:block;font-size:13px;font-weight:600;color:#374151;margin-bottom:8px;">Password</label>
        <div style="position:relative;">
          <input v-model="loginForm.password" :type="showPass?'text':'password'" placeholder="Masukkan password"
            style="width:100%;padding:14px 16px;border:1.5px solid #E5E7EB;border-radius:12px;font-size:15px;color:#111827;outline:none;transition:border 0.2s;"
            @focus="e=>e.target.style.borderColor='#bb9707'" @blur="e=>e.target.style.borderColor='#E5E7EB'"
            @keyup.enter="login">
          <button @click="showPass=!showPass" style="position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;border:none;color:#9CA3AF;">
            <svg v-if="!showPass" width="20" height="20" fill="none" viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z" fill="currentColor"/></svg>
            <svg v-else width="20" height="20" fill="none" viewBox="0 0 24 24"><path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46A11.804 11.804 0 0 0 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z" fill="currentColor"/></svg>
          </button>
        </div>
      </div>

      <div v-if="loginError" style="background:#FEF2F2;border:1px solid #FCA5A5;border-radius:10px;padding:12px 14px;margin-bottom:16px;font-size:13px;color:#DC2626;">
        {{ loginError }}
      </div>

      <button @click="login"
        style="width:100%;padding:16px;background:linear-gradient(135deg,#bb9707,#644404);color:white;font-size:16px;font-weight:700;border:none;border-radius:14px;letter-spacing:0.3px;transition:opacity 0.2s;"
        @mousedown="e=>e.target.style.opacity='0.85'" @mouseup="e=>e.target.style.opacity='1'">
        Masuk
      </button>

      <p style="text-align:center;font-size:12px;color:#9CA3AF;margin-top:20px;">
        Semoga hari kita diberkahi Allah SWT, dan segala aktivitas kita menjadi ladang pahala. Aamiin.
      </p>
    </div>
  </div>
</template>

<template v-else>
  <!-- MAIN APP -->
  <div style="min-height:100vh;display:flex;flex-direction:column;">

    <!-- TOP BAR -->
    <div style="background:white;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #E5E7EB;position:sticky;top:0;z-index:100;">
      <div style="display:flex;align-items:center;gap:10px;">
        <div style="width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#bb9707,#644404);display:flex;align-items:center;justify-content:center;">
          <span style="color:white;font-size:13px;font-weight:700;">{{ currentUser.name.charAt(0).toUpperCase() }}</span>
        </div>
        <div>
          <p style="font-size:14px;font-weight:700;color:#111827;line-height:1.2;">{{ currentUser.name }}</p>
          <p style="font-size:11px;color:#6B7280;text-transform:capitalize;">{{ currentUser.role === 'admin' ? 'Administrator' : 'Mujahid' }}</p>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:8px;">
        <button @click="logout" style="width:36px;height:36px;border-radius:10px;background:#FEF2F2;border:none;display:flex;align-items:center;justify-content:center;">
          <svg width="18" height="18" fill="none" viewBox="0 0 24 24"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z" fill="#EF4444"/></svg>
        </button>
      </div>
    </div>

    <!-- CONTENT -->
    <div style="flex:1;overflow-y:auto;padding-bottom:80px;">

      <!-- ===== ADMIN VIEW ===== -->
      <template v-if="currentUser.role === 'admin'">

        <!-- Admin Tab Nav -->
        <div style="background:white;padding:0 16px;display:flex;gap:4px;border-bottom:1px solid #E5E7EB;">
          <button v-for="tab in adminTabs" :key="tab.id" @click="adminTab=tab.id"
            :style="`flex:1;padding:12px 4px;font-size:12px;font-weight:600;border:none;background:none;border-bottom:2px solid ${adminTab===tab.id?'#bb9707':'transparent'};color:${adminTab===tab.id?'#bb9707  ':'#6B7280'};transition:all 0.2s;`">
            {{ tab.label }}
          </button>
        </div>

        <!-- ADMIN: Dashboard -->
        <div v-if="adminTab==='dashboard'" style="padding:16px;">
          <h3 style="font-size:17px;font-weight:700;color:#111827;margin-bottom:16px;">Rekap Hari Ini</h3>

          <!-- Stats Grid -->
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px;">
            <div v-for="stat in todayStats" :key="stat.label"
              :style="`background:white;border-radius:16px;padding:16px;border-left:4px solid ${stat.color};`">
              <p :style="`font-size:28px;font-weight:700;color:${stat.color};`">{{ stat.value }}</p>
              <p style="font-size:12px;color:#6B7280;margin-top:4px;">{{ stat.label }}</p>
            </div>
          </div>


          <!-- Recent attendance -->
          <h3 style="font-size:15px;font-weight:700;color:#111827;margin-bottom:12px;">Kehadiran Hari Ini</h3>
          <div v-if="todayAttendanceList.length===0" style="background:white;border-radius:16px;padding:24px;text-align:center;">
            <p style="color:#9CA3AF;font-size:14px;">Belum ada data absensi hari ini</p>
          </div>
          <div v-for="att in todayAttendanceList" :key="att.user_id"
            style="background:white;border-radius:14px;padding:14px 16px;margin-bottom:8px;display:flex;align-items:center;gap:12px;">

            <div style="flex:1;">
              <p style="font-size:14px;font-weight:600;color:#111827;">{{ getUserName(att.user_id) }}</p>
              <p style="font-size:12px;color:#6B7280;">
                {{ att.check_in ? 'Hadir : ' + att.check_in : '' }}
                {{ att.check_out ? ' · | Pulang: ' + att.check_out : '' }}
                
                {{ att.note ? ' · ' + att.note : '' }}
              </p>
            </div>

          </div>
        </div>

        <!-- ADMIN: User Management -->
        <div v-if="adminTab==='users'" style="padding:16px;">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;">
            <h3 style="font-size:17px;font-weight:700;color:#111827;">Data {{employeeUsers.length}} Mujahid</h3>
            <button @click="openAddUser"
              style="padding:8px 14px;background:#dd861c;color:white;font-size:13px;font-weight:600;border:none;border-radius:10px;">
              + Tambah
            </button>
          </div>

          <div v-for="user in employeeUsers" :key="user.id"
            style="background:white;border-radius:14px;padding:14px 16px;margin-bottom:8px;display:flex;align-items:center;gap:12px;">

            <div style="flex:1;">
              <p style="font-size:15px;font-weight:600;color:#111827;">{{ user.name }}</p>
              <p style="font-size:12px;color:#6B7280;">{{ getMonthlyStats(user.id) }}</p>
            </div>
            <div style="display:flex;gap:6px;">
              <button @click="openEditUser(user)" style="width:34px;height:34px;border-radius:8px;background:#EBF5FB;border:none;display:flex;align-items:center;justify-content:center;">
                <svg width="16" height="16" fill="none" viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z" fill="#dd861c"/></svg>
              </button>
              <button @click="deleteUser(user.id)" style="width:34px;height:34px;border-radius:8px;background:#FEF2F2;border:none;display:flex;align-items:center;justify-content:center;">
                <svg width="16" height="16" fill="none" viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z" fill="#EF4444"/></svg>
              </button>
            </div>
          </div>
        </div>

        <!-- ADMIN: Monthly Report -->
        <div v-if="adminTab==='report'" style="padding:16px;">
          <h3 style="font-size:17px;font-weight:700;color:#111827;margin-bottom:16px;">Rekap Bulanan</h3>

          <!-- Filters -->
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;">
            <div>
              <label style="font-size:12px;font-weight:600;color:#374151;display:block;margin-bottom:6px;">Bulan</label>
              <select v-model="reportFilter.month"
                style="width:100%;padding:10px 12px;border:1.5px solid #E5E7EB;border-radius:10px;font-size:13px;color:#111827;background:white;outline:none;">
                <option v-for="m in months" :key="m.value" :value="m.value">{{ m.label }}</option>
              </select>
            </div>
            <div>
              <label style="font-size:12px;font-weight:600;color:#374151;display:block;margin-bottom:6px;">Mujahid</label>
              <select v-model="reportFilter.userId"
                style="width:100%;padding:10px 12px;border:1.5px solid #E5E7EB;border-radius:10px;font-size:13px;color:#111827;background:white;outline:none;">
                <option value="">Semua</option>
                <option v-for="u in employeeUsers" :key="u.id" :value="u.id">{{ u.name }}</option>
              </select>
            </div>
                      <button
          @click="exportCSV"
          style="
            display: flex; align-items: center; gap: 6px;
            background: #059669; color: #fff;
            border: none; border-radius: 10px;
            padding: 10px 16px; font-size: 14px; font-weight: 600;
            cursor: pointer; margin-top: 8px; width: 100%;
            justify-content: center;
          "
        >
          Export
        </button>
          </div>

          <!-- Summary Chips -->
        <div style="display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:16px;">
          <div v-for="s in reportSummary" :key="s.label"
            :style="`flex-shrink:0;padding:6px 14px;border-radius:8px;background:#F9FAFB;border:1px solid #E5E7EB;`">
            <span :style="`font-size:13px;font-weight:700;color:${s.color};`">{{ s.value }}</span>
            <span style="font-size:12px;color:#6B7280;margin-left:4px;">{{ s.label }}</span>
          </div>
        </div>

          <!-- Table -->
          <div style="background:white;border-radius:16px;overflow:hidden;">
            <div style="overflow-x:auto;">
              <table style="width:100%;border-collapse:collapse;min-width:500px;">
                <thead>
                  <tr style="background:#F9FAFB;">
                    <th style="padding:12px 14px;text-align:left;font-size:11px;font-weight:700;color:#6B7280;text-transform:uppercase;letter-spacing:0.5px;">Nama</th>
                    <th style="padding:12px 14px;text-align:left;font-size:11px;font-weight:700;color:#6B7280;text-transform:uppercase;letter-spacing:0.5px;">Tanggal</th>
                    <th style="padding:12px 14px;text-align:left;font-size:11px;font-weight:700;color:#6B7280;text-transform:uppercase;letter-spacing:0.5px;">Status</th>
                    <th style="padding:12px 14px;text-align:left;font-size:11px;font-weight:700;color:#6B7280;text-transform:uppercase;letter-spacing:0.5px;">Masuk</th>
                    <th style="padding:12px 14px;text-align:left;font-size:11px;font-weight:700;color:#6B7280;text-transform:uppercase;letter-spacing:0.5px;">Pulang</th>
                    <th style="padding:12px 14px;text-align:left;font-size:11px;font-weight:700;color:#6B7280;text-transform:uppercase;letter-spacing:0.5px;">Aksi</th>
                  </tr>
                </thead>
                <tbody>
                  <tr v-for="row in filteredReport" :key="row.key" style="border-top:1px solid #F3F4F6;">
                    <td style="padding:12px 14px;font-size:13px;font-weight:600;color:#111827;white-space:nowrap;">{{ row.name }}</td>
                    <td style="padding:12px 14px;font-size:13px;color:#374151;white-space:nowrap;">{{ row.dateDisplay }}</td>
                    <td style="padding:12px 14px;">
                      <span :style="`font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;background:${statusColor(row.status)}22;color:${statusColor(row.status)};white-space:nowrap;`">
                        {{ statusLabel(row.status) }}
                      </span>
                    </td>
                    <td style="padding:12px 14px;font-size:13px;color:#374151;">{{ row.check_in || '-' }}</td>
                    <td style="padding:12px 14px;font-size:13px;color:#374151;">{{ row.check_out || '-' }}</td>
                    <td style="padding:12px 14px;">
                      <button @click="openEditAttendance(row)" style="padding:5px 10px;background:#EBF5FB;color:#dd861c;font-size:12px;font-weight:600;border:none;border-radius:8px;">Edit</button>
                    </td>
                  </tr>
                  <tr v-if="filteredReport.length===0">
                    <td colspan="6" style="padding:24px;text-align:center;font-size:14px;color:#9CA3AF;">Tidak ada data</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>

      </template>

      <!-- ===== Mujahid VIEW ===== -->
      <template v-else>

        <!-- Mujahid Tab Nav -->
        <div style="background:white;padding:0 16px;display:flex;gap:4px;border-bottom:1px solid #E5E7EB;">
          <button v-for="tab in userTabs" :key="tab.id" @click="userTab=tab.id"
            :style="`flex:1;padding:12px 4px;font-size:12px;font-weight:600;border:none;background:none;border-bottom:2px solid ${userTab===tab.id?'#dd861c':'transparent'};color:${userTab===tab.id?'#dd861c':'#6B7280'};transition:all 0.2s;`">
            {{ tab.label }}
          </button>
        </div>

        <!-- USER: Dashboard -->
        <div v-if="userTab==='home'" style="padding:16px;">

          <!-- Greeting Card -->
          <div style="background:linear-gradient(135deg,#dd861c,#e33e0c);border-radius:20px;padding:20px;margin-bottom:20px;color:white;">
            <p style="font-size:13px;opacity:0.85;margin-bottom:4px;">{{ greeting }},</p>
            <p style="font-size:20px;font-weight:700;margin-bottom:16px;">{{ currentUser.name }}</p>
            <div style="display:flex;justify-content:space-between;align-items:flex-end;">
              <div>
                <p style="font-size:12px;opacity:0.75;">Hari ini</p>
                <p style="font-size:15px;font-weight:600;">{{ todayFormatted }}</p>
              </div>
              <div style="background:rgba(255,255,255,0.2);border-radius:12px;padding:10px 16px;text-align:center;">
                <p style="font-size:24px;font-weight:700;">{{ currentTime }}</p>
                <p style="font-size:11px;opacity:0.8;">WIB</p>
              </div>
            </div>
          </div>

          <!-- Today Status -->
          <div style="background:white;border-radius:16px;padding:18px;margin-bottom:16px;">
            <h3 style="font-size:14px;font-weight:700;color:#111827;margin-bottom:14px;">Status Hari Ini</h3>
            <template v-if="todayMyAttendance">
              <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px;">

                <div>
                  <p :style="`font-size:16px;font-weight:700;color:${statusColor(todayMyAttendance.status)};`">{{ statusLabel(todayMyAttendance.status) }}</p>
                  <p style="font-size:12px;color:#6B7280;" v-if="todayMyAttendance.note">{{ todayMyAttendance.note }}</p>
                </div>
              </div>
              <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
                <div style="background:#F9FAFB;border-radius:12px;padding:12px;">
                  <p style="font-size:11px;color:#6B7280;margin-bottom:4px;">Jam Masuk</p>
                  <p style="font-size:18px;font-weight:700;color:#111827;">{{ todayMyAttendance.check_in || '-' }}</p>
                </div>
                <div style="background:#F9FAFB;border-radius:12px;padding:12px;">
                  <p style="font-size:11px;color:#6B7280;margin-bottom:4px;">Jam Pulang</p>
                  <p style="font-size:18px;font-weight:700;color:#111827;">{{ todayMyAttendance.check_out || '-' }}</p>
                </div>
              </div>

              <!-- Check out button -->
          <button v-if="canCheckOut" @click="openCheckOut"
            style="width:100%;margin-top:14px;padding:14px;background:#e33e0c;color:white;font-size:15px;font-weight:700;border:none;border-radius:14px;">
            Masukkan Jam Pulang
          </button>
              <div v-else-if="todayMyAttendance.check_out"
                style="margin-top:12px;background:#D1FAE5;border-radius:12px;padding:12px;text-align:center;">
                <p style="font-size:13px;font-weight:600;color:#065F46;">Absensi hari ini selesai</p>
              </div>
            </template>
            <template v-else>
              <div style="text-align:center;padding:8px 0;">
                <p style="font-size:40px;margin-bottom:8px;">📋</p>
                <p style="font-size:14px;color:#6B7280;margin-bottom:4px;">Belum absen hari ini</p>
                <p style="font-size:12px;color:#9CA3AF;">Silakan lakukan absen masuk</p>
              </div>
            </template>
          </div>

          <!-- Sudah Absen Hari Ini (collapsible) -->
          <div style="background:white;border-radius:16px;padding:18px;margin-bottom:16px;">
            <div @click="showTodayAttendance = !showTodayAttendance"
              style="display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none;">
              <div style="display:flex;align-items:center;gap:8px;">
                <span style="font-size:14px;font-weight:700;color:#090707;">{{ todayAttendanceList.length }} Mujahid/ah</span>
                <h3 style="font-size:14px;font-weight:700;color:#111827;margin:0;">sudah absen hari ini</h3>
              </div>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                :style="`transition:transform 0.2s;transform:rotate(${showTodayAttendance ? 180 : 0}deg);`">
                <path d="M6 9l6 6 6-6" stroke="#6B7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>

            <div v-if="showTodayAttendance" style="margin-top:14px;">
              <template v-if="todayAttendanceList.length">
                <div v-for="(a, index) in todayAttendanceList" :key="a.user_id"
                  :style="`display:flex;align-items:center;gap:10px;padding:10px 0;${index < todayAttendanceList.length - 1 ? 'border-bottom:1px solid #F3F4F6;' : ''}`">
                  <div style="width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#dd861c,#e33e0c);color:white;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex-shrink:0;">
                    {{ getUserName(a.user_id).charAt(0).toUpperCase() }}
                  </div>
                  <div style="flex:1;min-width:0;">
                    <p style="font-size:13px;font-weight:600;color:#111827;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">{{ getUserName(a.user_id) }}</p>
                    <p :style="`font-size:11px;font-weight:600;color:${statusColor(a.status)};`">{{ statusLabel(a.status) }}</p>
                  </div>
                  <div style="text-align:right;flex-shrink:0;">
                    <p style="font-size:13px;font-weight:700;color:#111827;">{{ a.check_in || '-' }}</p>
                    <p v-if="a.check_out" style="font-size:10px;color:#9CA3AF;">s/d {{ a.check_out }}</p>
                  </div>
                </div>
              </template>
              <template v-else>
                <div style="text-align:center;padding:16px 0;">
                  <p style="font-size:13px;color:#9CA3AF;">Belum ada yang absen hari ini</p>
                </div>
              </template>
            </div>
          </div>

          <!-- Peringatan + Tombol Jam Pulang Kemarin -->
          <div v-if="hasUnfinishedCheckout && unfinishedAttendance"
            style="background:#FEF2F2;border:1.5px solid #FECACA;border-radius:16px;padding:16px;margin-bottom:16px;">
            <div style="display:flex;gap:10px;align-items:flex-start;margin-bottom:14px;">
              <span style="font-size:22px;">⚠️</span>
              <div>
                <p style="font-size:14px;font-weight:700;color:#DC2626;margin-bottom:4px;">Absen Kemarin Belum Diisi</p>
                <p style="font-size:12px;color:#EF4444;line-height:1.5;">
                  Tanggal <strong>{{ unfinishedAttendance.date }}</strong> — jam pulang kemarin belum tercatat.
                </p>
              </div>
            </div>
            <button @click="checkOutTime=currentTime; showCheckOutModal=true; editingAtt=unfinishedAttendance"
              style="width:100%;padding:12px;background:#DC2626;color:white;font-size:14px;font-weight:700;border:none;border-radius:12px;">
              Isi Jam Pulang Kemarin
            </button>
          </div>

          <!-- Absen Masuk Button (if not yet) -->
          <button v-if="!todayMyAttendance" @click="userTab='absen'"
            style="width:100%;padding:18px;background:linear-gradient(135deg,#dd861c,#e33e0c);color:white;font-size:16px;font-weight:700;border:none;border-radius:16px;display:flex;align-items:center;justify-content:center;gap:10px;">
           
            Absen Masuk Sekarang
          </button>

<!-- Monthly Mini Stats - deskripsi teks -->
<div style="margin-top:16px;background:white;border-radius:14px;padding:14px 16px;">
  <h3 style="font-size:14px;font-weight:700;color:#111827;margin-bottom:2px;">Bulan Ini</h3>
  <p style="font-size:11px;color:#9CA3AF;margin-bottom:10px;">Rincian kehadiran</p>
  <div style="display:flex;flex-direction:column;">
    <div v-for="(s, index) in myMonthStats" :key="s.label"
      :style="`display:flex;align-items:center;justify-content:space-between;padding:8px 0;${index < myMonthStats.length - 1 ? 'border-bottom:1px solid #F3F4F6;' : ''}`">
      <span style="font-size:13px;color:#6B7280;">{{ s.label }}</span>
      <span :style="`font-size:13px;font-weight:700;color:${s.color};`">{{ s.value }} hari</span>
    </div>
  </div>
</div>
        </div>

        <!-- USER: Absen Form -->
        <div v-if="userTab==='absen'" style="padding:16px;">
          <h3 style="font-size:17px;font-weight:700;color:#111827;margin-bottom:6px;">Form Absensi</h3>
          <p style="font-size:13px;color:#6B7280;margin-bottom:20px;">{{ todayFormatted }}</p>
          <div v-if="hasUnfinishedCheckout" style="background:#FEF2F2;border:1.5px solid #FECACA;border-radius:14px;padding:16px;margin-bottom:16px;display:flex;gap:12px;align-items:flex-start;">
          <span style="font-size:22px;">⚠️</span>
          <div>
            <p style="font-size:14px;font-weight:700;color:#DC2626;margin-bottom:4px;">Absen Kemarin Belum Diisi</p>
            <p style="font-size:12px;color:#EF4444;line-height:1.5;">Antum belum mengisi jam pulang hari kerja sebelumnya. Silakan isi jam pulang terlebih dahulu melalui tab <strong>Beranda</strong>.</p>
          </div>
        </div>
          <template v-if="todayMyAttendance">
            <div style="background:white;border-radius:16px;padding:24px;text-align:center;">
              <p style="font-size:48px;margin-bottom:12px;"></p>
              <p style="font-size:16px;font-weight:700;color:#111827;margin-bottom:8px;">Sudah Absen Hari Ini</p>
              <p style="font-size:13px;color:#6B7280;">Status: <strong>{{ statusLabel(todayMyAttendance.status) }}</strong></p>
              <p style="font-size:13px;color:#6B7280;" v-if="todayMyAttendance.check_in">Jam Masuk: {{ todayMyAttendance.check_in }}</p>
            </div>
          </template>
          <template v-else>
            <!-- Status Selection -->
            <div style="background:white;border-radius:16px;padding:16px;margin-bottom:16px;">
              <p style="font-size:13px;font-weight:600;color:#374151;margin-bottom:12px;">Pilih Status Kehadiran</p>
              <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
                <button v-for="s in attendanceStatuses" :key="s.value"
                  @click="absenForm.status = s.value"
                  :style="`padding:14px;border-radius:14px;border:2px solid ${absenForm.status===s.value ? s.color : '#E5E7EB'};background:${absenForm.status===s.value ? s.color+'18' : 'white'};display:flex;flex-direction:column;align-items:flex-start;gap:6px;transition:all 0.2s;`">
                  <span style="font-size:24px;">{{ s.icon }}</span>
                  <span :style="`font-size:13px;font-weight:700;color:${absenForm.status===s.value ? s.color : '#374151'};`">{{ s.label }}</span>
                  <span style="font-size:11px;color:#9CA3AF;text-align:left;line-height:1.3;">{{ s.desc }}</span>
                </button>
              </div>
            </div>

            <!-- Jam Masuk 
            <div v-if="absenForm.status==='hadir'" style="background:white;border-radius:16px;padding:16px;margin-bottom:16px;">
              <p style="font-size:13px;font-weight:600;color:#374151;margin-bottom:10px;">Jam Masuk</p>
              <div style="display:flex;align-items:center;gap:10px;">
                <input v-model="absenForm.check_in" type="time"
                  style="flex:1;padding:12px;border:1.5px solid #E5E7EB;border-radius:12px;font-size:18px;font-weight:700;color:#111827;outline:none;text-align:center;">
                <button @click="absenForm.check_in=currentTime"
                  style="padding:12px 14px;background:#EBF5FB;color:#dd861c;font-size:13px;font-weight:600;border:none;border-radius:12px;white-space:nowrap;">
                  Sekarang
                </button>
              </div>
            </div>-->

            <!-- Keterangan -->
            <div v-if="absenForm.status && absenForm.status!=='hadir'" style="background:white;border-radius:16px;padding:16px;margin-bottom:16px;">
              <p style="font-size:13px;font-weight:600;color:#374151;margin-bottom:10px;">
                {{ absenForm.status==='izin' ? 'Alasan Izin' : absenForm.status==='sakit' ? 'Keterangan Sakit' : 'Keterangan Tugas' }}
              </p>
              <textarea v-model="absenForm.note" rows="3" placeholder="Tulis keterangan..."
                style="width:100%;padding:12px;border:1.5px solid #E5E7EB;border-radius:12px;font-size:14px;color:#111827;resize:none;outline:none;line-height:1.5;"></textarea>
            </div>

            <!-- Info GPS untuk status Hadir -->
<div v-if="absenForm.status==='hadir'" style="background:#EFF6FF;border:1px solid #BFDBFE;border-radius:14px;padding:14px;margin-bottom:14px;display:flex;gap:10px;align-items:flex-start;">
  <span style="font-size:18px;">📍</span>
  <div>
    <p style="font-size:13px;font-weight:700;color:#e33e0c;margin-bottom:2px;">Harus berada di sekitar kantor</p>
    <p style="font-size:12px;color:#3B82F6;line-height:1.4;">Mohon aktifkan GPS atau Lokasi di HP</p>
  </div>
</div>

<!-- Status GPS saat sedang proses -->
<div v-if="geoStatus==='checking'" style="background:#FEF3C7;border:1px solid #FDE    68A;border-radius:14px;padding:14px;margin-bottom:14px;display:flex;gap:10px;align-items:center;">
  <span style="font-size:18px;">🔄</span>
  <p style="font-size:13px;font-weight:600;color:#92400E;">{{ geoMessage }}</p>
</div>

<!-- Gagal: di luar radius atau GPS ditolak -->
<div v-if="geoStatus==='failed' || geoStatus==='denied'" style="background:#FEF2F2;border:1px solid #FECACA;border-radius:14px;padding:14px;margin-bottom:14px;display:flex;gap:10px;align-items:flex-start;">
  <span style="font-size:18px;">❌</span>
  <div>
    <p style="font-size:13px;font-weight:700;color:#DC2626;margin-bottom:2px;">Absen Gagal</p>
    <p style="font-size:12px;color:#EF4444;line-height:1.4;">{{ geoMessage }}</p>
  </div>
</div>

<button v-if="absenForm.status" @click="submitAbsen" :disabled="geoStatus==='checking'"
  :style="`width:100%;padding:18px;background:linear-gradient(135deg,#dd861c,#e33e0c);color:white;font-size:16px;font-weight:700;border:none;border-radius:16px;opacity:${geoStatus==='checking'?'0.6':'1'};`">
  {{ geoStatus==='checking' ? 'Mengecek Lokasi...' : absenForm.status==='hadir' ? 'Konfirmasi Absen + GPS' : ' Konfirmasi Absen' }}
</button>
          </template>
        </div>

        <!-- USER: History -->
        <div v-if="userTab==='riwayat'" style="padding:16px;">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;">
            <h3 style="font-size:17px;font-weight:700;color:#111827;">Riwayat Absensi</h3>
            <select v-model="historyMonth"
              style="padding:8px 12px;border:1.5px solid #E5E7EB;border-radius:10px;font-size:13px;color:#111827;background:white;outline:none;">
              <option v-for="m in months" :key="m.value" :value="m.value">{{ m.label }}</option>
            </select>
          </div>

          <!-- Stats -->
          <div style="display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:16px;">
            <div v-for="s in myMonthStats" :key="s.label"
              :style="`flex-shrink:0;padding:8px 16px;border-radius:20px;background:${s.color}22;border:1px solid ${s.color}44;`">
              <span :style="`font-size:14px;font-weight:700;color:${s.color};`">{{ s.value }}</span>
              <span style="font-size:12px;color:#6B7280;margin-left:5px;">{{ s.label }}</span>
            </div>
          </div>

          <div v-for="att in myHistory" :key="att.date"
            style="background:white;border-radius:14px;padding:14px 16px;margin-bottom:8px;display:flex;align-items:center;gap:12px;">
            <div :style="`width:44px;height:44px;border-radius:12px;background:${statusColor(att.status)}18;display:flex;flex-direction:column;align-items:center;justify-content:center;`">
              <span :style="`font-size:14px;font-weight:700;color:${statusColor(att.status)};`">{{ att.date.slice(-2) }}</span>
              <span style="font-size:9px;color:#9CA3AF;text-transform:uppercase;">{{ getDayName(att.date) }}</span>
            </div>
            <div style="flex:1;">
              <div style="display:flex;align-items:center;gap:8px;">

              </div>
              <p style="font-size:12px;color:#6B7280;margin-top:4px;">
                {{ att.check_in ? 'Hadir : ' + att.check_in : '' }}
                {{ att.check_out ? '  | Pulang : ' + att.check_out : '' }}
                <span v-if="att.status === 'hadir' && att.check_in"
                :style="`display:inline-block;margin-top:4px;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;background:${getArrivalCategory(att.check_in)?.bg};color:${getArrivalCategory(att.check_in)?.color};`">
                {{ getArrivalCategory(att.check_in)?.emoji }} {{ getArrivalCategory(att.check_in)?.label }}
              </span>
                <span v-if="att.status==='libur'" style="color:#9CA3AF;">Hari Libur</span>
              </p>
              <p v-if="att.note" style="font-size:12px;color:#9CA3AF;margin-top:2px;">{{ att.note }}</p>
            </div>
          </div>

          <div v-if="myHistory.length===0" style="background:white;border-radius:16px;padding:32px;text-align:center;">
            <p style="font-size:40px;margin-bottom:8px;">📅</p>
            <p style="font-size:14px;color:#6B7280;">Tidak ada data bulan ini</p>
          </div>
        </div>

      </template>

    </div>
    <!-- END CONTENT -->

  </div>
</template>

<!-- Add/Edit User Modal -->
<div v-if="showUserModal"
  style="position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:200;display:flex;align-items:flex-end;justify-content:center;">
  <div style="background:white;border-radius:24px 24px 0 0;padding:24px;width:100%;max-width:430px;">
    <h3 style="font-size:18px;font-weight:700;color:#111827;margin-bottom:20px;">
      {{ editingUser ? 'Edit Mujahid' : 'Tambah Mujahid' }}
    </h3>
    <div style="margin-bottom:14px;">
      <label style="font-size:13px;font-weight:600;color:#374151;display:block;margin-bottom:8px;">Nama</label>
      <input v-model="userForm.name" type="text" placeholder="Nama Mujahid"
        style="width:100%;padding:13px 14px;border:1.5px solid #E5E7EB;border-radius:12px;font-size:15px;color:#111827;outline:none;">
    </div>
    <div style="margin-bottom:20px;">
      <label style="font-size:13px;font-weight:600;color:#374151;display:block;margin-bottom:8px;">Password</label>
      <input v-model="userForm.password" type="text" placeholder="Password"
        style="width:100%;padding:13px 14px;border:1.5px solid #E5E7EB;border-radius:12px;font-size:15px;color:#111827;outline:none;">
    </div>
    <div v-if="formError" style="background:#FEF2F2;border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:13px;color:#DC2626;">{{ formError }}</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
      <button @click="showUserModal=false" style="padding:14px;border:1.5px solid #E5E7EB;border-radius:12px;font-size:15px;font-weight:600;color:#374151;background:white;">Batal</button>
      <button @click="saveUser" style="padding:14px;background:#dd861c;border:none;border-radius:12px;font-size:15px;font-weight:700;color:white;">Simpan</button>
    </div>
  </div>
</div>

<!-- Edit Attendance Modal -->
<div v-if="showAttModal"
  style="position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:200;display:flex;align-items:flex-end;justify-content:center;">
  <div style="background:white;border-radius:24px 24px 0 0;padding:24px;width:100%;max-width:430px;">
    <h3 style="font-size:18px;font-weight:700;color:#111827;margin-bottom:4px;">Edit Absensi</h3>
    <p style="font-size:13px;color:#6B7280;margin-bottom:20px;">{{ editingAtt.name }} — {{ editingAtt.dateDisplay }}</p>

    <div style="margin-bottom:14px;">
      <label style="font-size:13px;font-weight:600;color:#374151;display:block;margin-bottom:8px;">Status</label>
      <select v-model="attForm.status"
        style="width:100%;padding:12px;border:1.5px solid #E5E7EB;border-radius:12px;font-size:14px;color:#111827;background:white;outline:none;">
        <option value="hadir">Hadir</option>
        <option value="izin">Izin</option>
        <option value="sakit">Sakit</option>
        <option value="tugas_luar">Tugas Luar</option>
        <option value="alpha">Alpha</option>
      </select>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;">
      <div>
        <label style="font-size:13px;font-weight:600;color:#374151;display:block;margin-bottom:8px;">Jam Masuk</label>
        <input v-model="attForm.check_in" type="time"
          style="width:100%;padding:12px;border:1.5px solid #E5E7EB;border-radius:12px;font-size:14px;color:#111827;outline:none;">
      </div>
      <div>
        <label style="font-size:13px;font-weight:600;color:#374151;display:block;margin-bottom:8px;">Jam Pulang</label>
        <input v-model="attForm.check_out" type="time"
          style="width:100%;padding:12px;border:1.5px solid #E5E7EB;border-radius:12px;font-size:14px;color:#111827;outline:none;">
      </div>
    </div>
    <div style="margin-bottom:20px;">
      <label style="font-size:13px;font-weight:600;color:#374151;display:block;margin-bottom:8px;">Keterangan</label>
      <input v-model="attForm.note" type="text" placeholder="Keterangan (opsional)"
        style="width:100%;padding:12px;border:1.5px solid #E5E7EB;border-radius:12px;font-size:14px;color:#111827;outline:none;">
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
      <button @click="showAttModal=false" style="padding:14px;border:1.5px solid #E5E7EB;border-radius:12px;font-size:15px;font-weight:600;color:#374151;background:white;">Batal</button>
      <button @click="saveAttendance" style="padding:14px;background:#dd861c;border:none;border-radius:12px;font-size:15px;font-weight:700;color:white;">Simpan</button>
    </div>
  </div>
</div>

<!-- Check Out Modal -->
<div v-if="showCheckOutModal"
  style="position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:200;display:flex;align-items:flex-end;justify-content:center;">
  <div style="background:white;border-radius:24px 24px 0 0;padding:24px;width:100%;max-width:430px;">
    <h3 style="font-size:18px;font-weight:700;color:#111827;margin-bottom:6px;">Masukkan Jam Pulang</h3>

    <div style="margin-bottom:20px;">

      <div style="display:flex;align-items:center;gap:10px;">
        <input v-model="checkOutTime" type="time"
          style="flex:1;padding:14px;border:1.5px solid #E5E7EB;border-radius:12px;font-size:22px;font-weight:700;color:#111827;outline:none;text-align:center;">
        <button @click="checkOutTime=currentTime"
          style="padding:14px;background:#EBF5FB;color:#dd861c;font-size:13px;font-weight:600;border:none;border-radius:12px;white-space:nowrap;">
          Sekarang
        </button>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
      <button @click="showCheckOutModal=false" style="padding:14px;border:1.5px solid #E5E7EB;border-radius:12px;font-size:15px;font-weight:600;color:#374151;background:white;">Batal</button>
      <button @click="confirmCheckOut" style="padding:14px;background:#e33e0c;border:none;border-radius:12px;font-size:15px;font-weight:700;color:white;">Konfirmasi Pulang</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div v-if="toast.show"
  :style="`position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:${toast.type==='success'?'#065F46':'#7F1D1D'};color:white;padding:12px 20px;border-radius:14px;font-size:14px;font-weight:600;z-index:300;white-space:nowrap;box-shadow:0 4px 20px rgba(0,0,0,0.2);`">
  {{ toast.msg }}
</div>

</div>

<script src="app.js"></script>

</body>
</html>
